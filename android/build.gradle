// Android client module — modernized for Android Gradle Plugin 8.x.
//
// This module is only configured when the Android SDK is present (see the
// guard in settings.gradle). Building it requires:
//   * JDK 17 (AGP 8 requirement)
//   * Android SDK with platform 34 and build-tools installed
//   * a local.properties with sdk.dir=... (or ANDROID_HOME exported)
//
// NOTE: this configuration has not yet been verified against a real Android
// SDK build in this environment. See docs/AndroidPort.md.

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.desertkun.brainout.android'
    compileSdk 34

    defaultConfig {
        applicationId 'com.desertkun.brainout.android'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            // Reflection-heavy codebase: keep R8 off until proguard rules are
            // validated (see docs/AndroidPort.md, Phase 9).
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-project.txt'
        }
    }

    androidResources {
        // Bundled data packages are already-compressed .zip; don't let AAPT
        // recompress them (slower build, no size win) so they stay readable.
        noCompress 'zip'
    }

    packagingOptions {
        // libGDX ships plain .so natives; keep legacy packaging so they load.
        jniLibs {
            useLegacyPackaging true
        }
        // Several transitive jars (Apache HttpClient, Netty, Kryo deps, ...)
        // each ship their own META-INF metadata/license files; drop the
        // duplicates so the resource merge does not fail.
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/LICENSE.md',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/NOTICE.md',
                'META-INF/notice.txt',
                'META-INF/INDEX.LIST',
                'META-INF/*.kotlin_module',
                'META-INF/io.netty.versions.properties',
                'META-INF/maven/**',
                '**/*.proto',
            ]
        }
    }
}

configurations { natives }

dependencies {
    implementation project(':client')

    // The core/client modules use the custom libGDX fork
    // (com.github.desertkun.libgdx:gdx). Exclude the stock gdx core that the
    // Android backend would otherwise pull in transitively, so only the fork's
    // gdx classes/resources are on the classpath (avoids duplicate class and
    // duplicate resource — e.g. default.fragment.glsl — merge failures).
    implementation("com.badlogicgames.gdx:gdx-backend-android:$gdxVersion") {
        exclude group: 'com.badlogicgames.gdx', module: 'gdx'
    }
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"

    implementation("com.badlogicgames.gdx:gdx-box2d:$gdxVersion") {
        exclude group: 'com.badlogicgames.gdx', module: 'gdx'
    }
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86_64"
}

// Extracts the libGDX native .so files out of the `natives` jars into the
// jniLibs folders so AGP packs them into the APK.
tasks.register('copyAndroidNatives') {
    doLast {
        configurations.natives.files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("libs/armeabi-v7a")
            if (jar.name.endsWith("natives-arm64-v8a.jar")) outputDir = file("libs/arm64-v8a")
            if (jar.name.endsWith("natives-x86.jar")) outputDir = file("libs/x86")
            if (jar.name.endsWith("natives-x86_64.jar")) outputDir = file("libs/x86_64")
            if (outputDir != null) {
                outputDir.mkdirs()
                copy {
                    from zipTree(jar)
                    into outputDir
                    include "*.so"
                }
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name == 'preBuild') {
        task.dependsOn 'copyAndroidNatives'
    }
}

task run(type: Exec) {
    def path
    def localProperties = project.file("../local.properties")
    if (localProperties.exists()) {
        Properties properties = new Properties()
        localProperties.withInputStream { instr ->
            properties.load(instr)
        }
        def sdkDir = properties.getProperty('sdk.dir')
        path = sdkDir ?: "$System.env.ANDROID_HOME"
    } else {
        path = "$System.env.ANDROID_HOME"
    }

    def adb = path + "/platform-tools/adb"
    commandLine "$adb", 'shell', 'am', 'start', '-n',
            'com.desertkun.brainout.android/com.desertkun.brainout.android.AndroidLauncher'
}
