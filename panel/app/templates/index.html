<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brain/Out Server Control Panel</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: system-ui, sans-serif; background:#14161a; color:#e6e6e6; margin:0; }
    header { display:flex; justify-content:space-between; align-items:center;
             padding:14px 20px; background:#1d2026; border-bottom:1px solid #2a2e36; }
    header h1 { font-size:17px; margin:0; }
    main { max-width:760px; margin:0 auto; padding:20px; display:grid; gap:18px; }
    .card { background:#1d2026; border:1px solid #2a2e36; border-radius:10px; padding:18px; }
    .card h2 { font-size:14px; margin:0 0 12px; color:#9aa3b2; text-transform:uppercase; letter-spacing:.04em; }
    label { display:block; font-size:13px; margin:10px 0 4px; color:#9aa3b2; }
    select, button { font-size:14px; }
    select { width:100%; padding:9px; border-radius:6px; border:1px solid #333; background:#0f1115; color:#e6e6e6; }
    .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
    button { padding:9px 16px; border:0; border-radius:6px; cursor:pointer; font-weight:600; }
    .primary { background:#3b7; color:#08210f; }
    .ghost { background:#2a2e36; color:#e6e6e6; }
    .danger { background:#a44; color:#fff; }
    .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; vertical-align:middle; }
    .up { background:#3b7; } .down { background:#a44; }
    .kv { display:grid; grid-template-columns:130px 1fr; gap:6px 12px; font-size:14px; }
    .kv div:nth-child(odd) { color:#9aa3b2; }
    pre { background:#0f1115; border:1px solid #2a2e36; border-radius:8px; padding:12px;
          max-height:340px; overflow:auto; font-size:12px; line-height:1.45; white-space:pre-wrap; }
    a.logout { color:#9aa3b2; text-decoration:none; font-size:13px; }
  </style>
</head>
<body>
  <header>
    <h1>Brain/Out Server Control Panel</h1>
    <form method="post" action="/logout"><button class="ghost">Sign out</button></form>
  </header>
  <main>
    <div class="card">
      <h2>Status</h2>
      <div class="kv" id="status">
        <div>State</div><div id="st-state">…</div>
        <div>Preset</div><div id="st-preset">—</div>
        <div>Map</div><div id="st-map">—</div>
        <div>Players</div><div id="st-players">—</div>
      </div>
      <div class="row">
        <button class="primary" onclick="action('start')">Start</button>
        <button class="danger" onclick="action('stop')">Stop</button>
        <button class="ghost" onclick="refreshStatus()">Refresh</button>
      </div>
    </div>

    <div class="card">
      <h2>Launch</h2>
      <label>Event / preset</label>
      <select id="preset" onchange="onPresetChange()"></select>
      <div id="map-wrap" style="display:none">
        <label>Map</label>
        <select id="map"></select>
      </div>
      <div class="row">
        <button class="primary" onclick="apply()">Apply &amp; (re)start</button>
      </div>
    </div>

    <div class="card">
      <h2>Logs</h2>
      <pre id="logs">…</pre>
      <div class="row"><button class="ghost" onclick="refreshLogs()">Refresh logs</button></div>
    </div>
  </main>

<script>
let CATALOG = {presets: []};

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (r.status === 401) { location.href = "/login"; return null; }
  return r;
}

async function loadCatalog() {
  const r = await api("/api/catalog"); if (!r) return;
  CATALOG = await r.json();
  const sel = document.getElementById("preset");
  sel.innerHTML = "";
  for (const p of CATALOG.presets) {
    const o = document.createElement("option");
    o.value = p.id; o.textContent = p.name; sel.appendChild(o);
  }
  onPresetChange();
}

function currentPreset() {
  const id = document.getElementById("preset").value;
  return CATALOG.presets.find(p => p.id === id);
}

function onPresetChange() {
  const p = currentPreset();
  const wrap = document.getElementById("map-wrap");
  const mapSel = document.getElementById("map");
  if (p && p.source_kind === "set" && p.maps.length) {
    mapSel.innerHTML = "";
    for (const m of p.maps) {
      const o = document.createElement("option");
      o.value = m.id; o.textContent = m.name; mapSel.appendChild(o);
    }
    wrap.style.display = "block";
  } else {
    wrap.style.display = "none";
  }
}

async function apply() {
  const p = currentPreset(); if (!p) return;
  const body = {preset_id: p.id, map_id: null};
  if (p.source_kind === "set") body.map_id = document.getElementById("map").value;
  const r = await api("/api/apply", {method:"POST", headers:{"Content-Type":"application/json"},
                                     body: JSON.stringify(body)});
  if (r && r.ok) { setTimeout(refreshStatus, 800); setTimeout(refreshLogs, 1500); }
  else if (r) { alert("Apply failed: " + (await r.text())); }
}

async function action(name) {
  const r = await api("/api/" + name, {method:"POST"});
  if (r && !r.ok) alert(name + " failed: " + (await r.text()));
  setTimeout(refreshStatus, 600);
}

async function refreshStatus() {
  const r = await api("/api/status"); if (!r) return;
  const s = await r.json();
  const state = document.getElementById("st-state");
  if (!s.available) { state.innerHTML = '<span class="dot down"></span>backend unavailable'; return; }
  const up = s.running;
  state.innerHTML = `<span class="dot ${up?'up':'down'}"></span>${up?'running':'stopped'} (${s.detail||''})`;
  document.getElementById("st-preset").textContent = s.preset_id || s.mode || "—";
  document.getElementById("st-map").textContent = s.current_map || s.map || "—";
  document.getElementById("st-players").textContent =
    s.player_count ? (s.player_count + (s.players.length ? " — " + s.players.join(", ") : "")) : "—";
}

async function refreshLogs() {
  const r = await api("/api/logs?tail=200"); if (!r) return;
  document.getElementById("logs").textContent = await r.text();
}

loadCatalog();
refreshStatus();
refreshLogs();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
