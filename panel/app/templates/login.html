<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brain/Out Panel — Login</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#14161a; color:#e6e6e6;
           display:flex; min-height:100vh; align-items:center; justify-content:center; margin:0; }
    form { background:#1d2026; padding:28px 32px; border-radius:10px; width:280px; }
    h1 { font-size:18px; margin:0 0 18px; }
    input { width:100%; padding:10px; border-radius:6px; border:1px solid #333; background:#0f1115;
            color:#e6e6e6; box-sizing:border-box; }
    button { width:100%; margin-top:14px; padding:10px; border:0; border-radius:6px;
             background:#3b7; color:#08210f; font-weight:600; cursor:pointer; }
    .err { color:#e66; font-size:13px; margin-top:10px; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1>Brain/Out Control Panel</h1>
    <input type="password" name="password" placeholder="Admin password" autofocus>
    <button type="submit">Sign in</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
